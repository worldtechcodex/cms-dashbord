 if(tab=='pages'){D.pages.forEach(p=>{const r=h('div','it'+(p.slug==cur?' on':''),'<span><i class="fa-regular fa-file"></i> '+p.title+' <small style="color:#888">/'+p.slug+'</small></span>');r.onclick=()=>{cur=p.slug;sel=null;push();panel()};P.append(r)});
  const n=h('button','b','<i class="fa-solid fa-plus"></i> Add New Page');n.onclick=newPage;P.append(n,h('hr'),h('h2','','Page settings'));const c=pg();P.append(field(c,'title','Page title'));
  if(c.slug!='home'){P.append(field(c,'slug','Page address (changing it breaks existing links)'));const d=h('button','b d','<i class="fa-solid fa-trash"></i> Delete this page');d.onclick=()=>{if(confirm('Delete page "'+c.title+'"?')){D.pages=D.pages.filter(x=>x!=c);cur='home';chg();panel()}};P.append(d)}}
 else if(tab=='elements'){const B=['text','image','button','spacer','html','banner'];P.append(h('p','hint','Drag an element onto the page, or click it to add.'));
  [['Basic',B],['Sections',Object.keys(D.cat).filter(k=>!B.includes(k))]].forEach(([g,a])=>{P.append(h('b','',g));const gd=h('div','pal');a.forEach(k=>{const t=h('div','tile','<i class="fa-solid fa-'+(IC[k]||'cube')+'"></i>'+(NM[k]||k));t.draggable=true;t.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({t:k}));t.onclick=()=>drop({t:k},cs(),1);gd.append(t)});P.append(gd)})}
 else if(tab=='layers'){const w=pg().w;P.append(h('p','hint','Drag to reorder, or use the arrows. Click to edit.'));
  w.forEach((x,i)=>{const r=h('div','it'+(x.id==sel?' on':''),'<i class="fa-solid fa-grip-vertical" style="color:#999"></i><span><i class="fa-solid fa-'+(IC[x.t]||'cube')+'" style="color:var(--a)"></i> '+(NM[x.t]||x.t)+' <small style="color:#888">'+((x.p.h||x.p.t||x.p.name||'')+'').slice(0,20)+'</small></span>');
   r.draggable=true;r.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({m:x.id}));r.ondragover=e=>e.preventDefault();r.ondrop=e=>{e.preventDefault();let o;try{o=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return}drop(o,x.id,0)};
   [['arrow-up',()=>{if(i)[w[i-1],w[i]]=[w[i],w[i-1]]}],['arrow-down',()=>{if(i<w.length-1)[w[i+1],w[i]]=[w[i],w[i+1]]}],['copy',()=>w.splice(i+1,0,{...cl(x),id:uid()})],['trash',()=>{if(confirm('Delete this widget?')){w.splice(i,1);sel=null}}]].forEach(([ic,fn])=>{const b=h('button','b s sm','<i class="fa-solid fa-'+ic+'"></i>');b.onclick=e=>{e.stopPropagation();fn();chg();panel()};r.append(b)});
   r.onclick=()=>{sel=x.id;tab='edit';push();panel();rail()};P.append(r)})}
 else if(tab=='edit'){const w=sel&&fw(sel);if(!w){P.append(h('p','hint','Select a widget in the preview first.'));return}ens(w);P.firstChild.textContent='Edit: '+(NM[w.t]||w.t);
  const tb=h('div','tabs');[['content','Content'],['d','Desktop'],['t','Tablet'],['m','Mobile'],['motion','Motion'],['adv','Advanced']].forEach(([k,l])=>{const b=h('button','b '+(st==k?'':'s sm'),l);b.onclick=()=>{st=k;panel()};tb.append(b)});P.append(tb);
  if(st=='content')fields(w.p,P);else if(st=='adv')P.append(field(w.s,'hide'),field(w.s,'cls'),field(w.s,'css'));else if(st=='motion'){P.append(h('p','hint','Entrance plays when the element scrolls into view. Hover effect plays when the mouse is over it.'));fields(w.s.anim,P)}else{P.append(h('p','hint',st=='d'?'Applies to all screens.':st=='t'?'Overrides on tablets (up to 1000px).':'Overrides on phones (up to 560px).'));fields(w.s[st],P)}}
 else if(tab=='header'){P.append(h('p','hint','Menu, dropdown items, button and colours. Add new pages here to show them in the menu.'));fields(D.header,P)}
 else if(tab=='footer')fields(D.footer,P);else if(tab=='settings')fields(D.site,P);else mediaPanel(P)}
async function mediaPanel(P){const up=h('button','b','<i class="fa-solid fa-upload"></i> Upload image');up.onclick=()=>upload(()=>panel());P.append(up,h('p','hint',''));let l=[];try{l=(await gh('uploads')).filter(f=>f.type=='file'&&!f.name.startsWith('.'))}catch{}
 const g=h('div','gr');l.forEach(f=>{const b=h('div','box','<img src="'+src(f.path)+'" alt="" onerror="this.style.opacity=.2"><small style="word-break:break-all;display:block;margin:4px 0">'+f.path+'</small>'),c=h('button','b s sm','Copy path'),d=h('button','b d sm','<i class="fa-solid fa-trash"></i>');
  c.onclick=()=>{navigator.clipboard.writeText(f.path);toast('Path copied')};d.onclick=async()=>{if(confirm('Delete this image?')){try{await gh(f.path,'DELETE',{message:'Delete image',sha:f.sha});panel()}catch(e){toast(e.message,1)}}};b.append(c,' ',d);g.append(b)});P.append(g.children.length?g:h('p','hint','No uploads yet.'))}
function shell(){if(LS.wtcrc)document.body.classList.add('rc');$('#r').innerHTML='<div class="app"><div class="rail" id="rl"><div class="brand"><i class="fa-solid fa-gauge-high"></i><b>Page Builder</b></div></div><div class="pn" id="pn"></div><div class="main"><div class="bar"><button class="b s sm" id="pt" title="Show / hide panel"><i class="fa-solid fa-table-columns"></i></button><select id="ps" style="width:auto;margin:0"></select><button class="b s sm" data-v="100%" title="Desktop"><i class="fa-solid fa-desktop"></i></button><button class="b s sm" data-v="768px" title="Tablet"><i class="fa-solid fa-tablet-screen-button"></i></button><button class="b s sm" data-v="390px" title="Mobile"><i class="fa-solid fa-mobile-screen"></i></button><span class="sp"></span><button class="b s" id="vw"><i class="fa-solid fa-arrow-up-right-from-square"></i> View site</button><button class="b" id="sv"><i class="fa-solid fa-floppy-disk"></i> Save</button></div><div class="pv"><iframe id="fr"></iframe></div></div></div>';
 const rl=$('#rl'),it=(ic,t,fn)=>{const r=h('div','ri'),a=h('a','','<i class="fa-solid fa-'+ic+'"></i><span>'+t+'</span>');a.onclick=fn;r.append(a);return[r,a]};
 RAIL.forEach(([k,ic,t])=>{const[r,a]=it(ic,t,()=>go(k));a.dataset.t=k;const f=h('div','fly '+(k=='pages'?'sub':'tip'));f.append(h('b','',t));if(k=='pages'){const l=h('a','','All Pages'),n=h('a','','Add New Page');l.onclick=()=>go('pages');n.onclick=newPage;f.append(l,n)}r.append(f);rl.append(r)});
 rl.append(h('div','sp'));const[c1,ca]=it('angles-left','Collapse menu',()=>{const x=document.body.classList.toggle('rc');if(x)LS.wtcrc=1;else delete LS.wtcrc;ca.firstChild.className='fa-solid fa-angles-'+(x?'right':'left')});rl.append(c1);
 const[lo]=it('right-from-bracket','Log out',()=>{delete LS.wtc;location.reload()});rl.append(lo);
 const ps=$('#ps'),fill=()=>{ps.innerHTML='';D.pages.forEach(p=>{const o=h('option');o.value=p.slug;o.textContent=p.title;ps.append(o)});ps.value=cur};fill();ps.onchange=()=>{cur=ps.value;sel=null;push();panel()};
 $('#pt').onclick=()=>document.body.classList.toggle('pc');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>$('#fr').style.width=b.dataset.v);$('#vw').onclick=()=>window.open(site()+'/','_blank');
 $('#sv').onclick=async()=>{try{await saveAll();toast('Saved. Website updates in about 1-2 minutes.')}catch(e){toast(e.message,1)}};
 fr=$('#fr');fr.src=site()+'/?edit=1#home';tab='pages';panel();rail();setInterval(()=>{if(ps.options.length!=D.pages.length||ps.value!=cur)fill()},600)}
addEventListener('message',e=>{if(e.origin!=location.origin||!e.data)return;if(e.data.ready)push();
 if(e.data.drop){let o;try{o=JSON.parse(e.data.drop.d)}catch{return}drop(o,e.data.drop.id,e.data.drop.after);return}
 if(e.data.sel!==undefined){sel=e.data.sel;st='content';if(sel=='header'||sel=='footer')tab=sel;else if(sel)tab='edit';else tab='layers';document.body.classList.remove('pc');panel();rail()}});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
async function boot(){if(!LS.wtc)return login();try{D=await load();shell()}catch(e){const g=G();delete LS.wtc;login(e.message,g)}}
function login(err,g={}){$('#r').innerHTML='<div class="lg"><div class="lb"><h1><i class="fa-solid fa-lock"></i> Page Builder Login</h1><p>World Tech Codex'+(err?'<br><b style="color:var(--er)">'+err+'</b>':'')+'</p><div class="f"><label>Website repo (owner/repo)</label><input id="rp" placeholder="worldtechcodex/home"></div><div class="f"><label>Branch</label><input id="br"></div><div class="f"><label>GitHub token</label><input id="tk" autocomplete="off"></div><button class="b" id="go" style="width:100%;justify-content:center">Log in</button></div></div>';
 $('#rp').value=g.repo||'';$('#br').value=g.branch||'main';const go=()=>{LS.wtc=JSON.stringify({repo:$('#rp').value.trim(),branch:$('#br').value.trim()||'main',token:$('#tk').value.trim()});boot()};$('#go').onclick=go;$('#tk').onkeydown=e=>{if(e.key=='Enter')go()}}
boot();
</script></body></html>
