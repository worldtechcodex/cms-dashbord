<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>World Tech Codex | CMS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--side:#1d2327;--sh:#2c3338;--a:#2271b1;--ah:#135e96;--bg:#f0f2f5;--c:#fff;--l:#dcdcde;--t:#1d2327;--m:#646970;--ok:#00a32a;--er:#d63638}
*{box-sizing:border-box;margin:0}body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lb{background:var(--c);padding:34px;border-radius:10px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.lb h1{font-size:22px;margin-bottom:4px}.lb p{color:var(--m);margin-bottom:20px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);color:#c3c4c7;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
aside h2{color:#fff;font-size:16px;padding:18px 20px;border-bottom:1px solid var(--sh)}
aside a{display:flex;gap:12px;align-items:center;padding:11px 20px;cursor:pointer;color:#c3c4c7}aside a i{width:18px;text-align:center}
aside a:hover{background:var(--sh);color:#72aee6}aside a.on{background:var(--a);color:#fff}
.sp{flex:1}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
main{padding:26px;max-width:980px;width:100%}h1.t{font-size:22px}
.f{margin-bottom:14px}.f>label{display:block;font-weight:600;margin-bottom:4px;text-transform:capitalize}
input[type=text],input[type=password],input:not([type]),textarea{width:100%;padding:9px 11px;border:1px solid #8c8f94;border-radius:5px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--a);border-color:var(--a)}textarea{min-height:70px;resize:vertical}
.box{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:16px;margin-bottom:14px}.box .box{background:#f9fafb}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:10px}.bar b{flex:1}
.b{display:inline-flex;gap:7px;align-items:center;padding:8px 14px;border:1px solid var(--a);background:var(--a);color:#fff;border-radius:5px;cursor:pointer;font:inherit;font-weight:600}
.b:hover{background:var(--ah)}.b.s{background:#fff;color:var(--a)}.b.s:hover{background:#f0f6fc}.b.d{background:#fff;color:var(--er);border-color:var(--er)}.b.sm{padding:4px 9px}
.sw{display:flex;gap:10px;align-items:center;background:#f6f7f7;padding:10px 12px;border-radius:6px;border:1px solid var(--l)}.sw input{width:20px;height:20px;accent-color:var(--a)}.sw label{font-weight:600;margin:0}
.im{display:flex;gap:10px;align-items:center}.im input{flex:1}.im img{height:42px;width:60px;object-fit:contain;background:#eee;border-radius:4px;border:1px solid var(--l)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.gr .box{padding:8px;text-align:center}.gr img{width:100%;height:100px;object-fit:cover;border-radius:4px}
.tl{position:fixed;bottom:20px;right:20px;background:var(--side);color:#fff;padding:12px 18px;border-radius:6px;z-index:9}.tl.er{background:var(--er)}
.hint{color:var(--m);margin-bottom:16px}.pm{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 12px}.pm label{display:flex;gap:6px;align-items:center;text-transform:capitalize}
.mb{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:fixed;left:-250px;width:240px;z-index:5;transition:.25s}aside.o{left:0}.mb{display:inline-flex}main{padding:16px}}
</style></head><body><div id="r"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.innerHTML=x;return e};
const LS=localStorage,G=()=>JSON.parse(LS.wtc||'{}');
const gh=async(p,m='GET',b)=>{const g=G();if(!g.token)throw Error('Token box is empty');if(/[^\x21-\x7e]/.test(g.token))throw Error('Token has spaces or invalid characters. Paste it again.');if(!/^[\w.-]+\/[\w.-]+$/.test(g.repo||''))throw Error('Repo must look like owner/repo, e.g. worldtechcodex/home');const r=await fetch('https://api.github.com/repos/'+g.repo+'/contents/'+p+(m=='GET'?'?ref='+g.branch+'&t='+Date.now():''),{method:m,headers:{Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'},body:b&&JSON.stringify({...b,branch:g.branch})});const j=await r.json().catch(()=>({}));if(!r.ok){const e=Error(r.status==401?'GitHub rejected the token (401). Your token length is '+g.token.length+' and starts with '+g.token.slice(0,4)+'. A classic token starts with ghp_ (40 characters); a fine-grained one starts with gith (80+ characters).':r.status==403||r.status==404?(m=='GET'?'Not found / no access':'No write access (token needs Contents: Read and write)'):r.status==409||r.status==422?'File changed on another device. Reload the page and try again.':j.message||'GitHub error');e.s=r.status;throw e}return j};
const u8=s=>{let t='';new TextEncoder().encode(s).forEach(c=>t+=String.fromCharCode(c));return btoa(t)},d8=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
let SHA;const load=async()=>{const j=await gh('data/content.js');SHA=j.sha;return JSON.parse(d8(j.content).replace(/^window\.__D=/,'').replace(/;\s*$/,''))};
const saveAll=async()=>{const j=await gh('data/content.js','PUT',{message:'CMS update',content:u8('window.__D='+JSON.stringify(C)+';'),sha:SHA});SHA=j.content.sha};
const site=()=>{const[o,r]=(G().repo||'').split('/');return 'https://'+o+'.github.io/'+r};
const src=v=>/^(https?:|\/|data:)/.test(v||'')?v:site()+'/'+(v||'');
const toast=(m,e)=>{const t=h('div','tl'+(e?' er':''),m);document.body.append(t);setTimeout(()=>t.remove(),2800)};
const TABS=[['PG','Pages & Text','file-lines','pages','Home, About, banners, stats and footer text. Every page title and paragraph.'],['S','Services','briefcase','pages','Service cards and detail pages. Keep "id" and "pr" values unchanged.'],['P','Pricing','tags','pricing','Prices, rows and packages. Use yes / no in values for tick / cross icons. Value lines must match the Rows order.'],['TEAM','Team','users','pages','Team members. Leave name empty to show only the role.'],['PORT','Portfolio','images','pages','Websites you built. Add, remove or reorder.'],['HIRE','Hiring (Apply Now)','user-tie','hiring','Turn hiring ON/OFF. This controls the Apply Now popup.'],['CFG','Site Settings','gear','settings','Logo, favicon and contact details.'],['SOC','Social Links','share-nodes','settings','Icon is a Font Awesome brand name, e.g. facebook-f, instagram.'],['media','Media Library','photo-film','media']];
const LB={t:'Title',d:'Description',f:'Features (one per line)',ic:'Icon (Font Awesome name)',img:'Image',pr:'Pricing page ID (do not change)',id:'Page ID (do not change)',h1:'Heading (first part)',h1b:'Heading (highlighted part)',p:'Text',b1:'Button 1',b2:'Button 2',n:'Number',l:'Label',per:'Per (e.g. / month)',addr:'Address',ban:'Page banner titles (left = original name, right = shown title)',url:'Link'};
let me,C={},cur,redraw;const IM=/^(img|logo|favicon)$/;
const blank=o=>Array.isArray(o)?[]:o&&typeof o=='object'?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,blank(v)])):typeof o=='boolean'?false:'';
function upload(done){const i=h('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>5e6)return toast('Image must be under 5 MB',1);const r=new FileReader();r.onload=async()=>{try{const n='uploads/'+Date.now()+'-'+f.name.replace(/\.\w+$/,'').replace(/\W/g,'').slice(0,20)+'.'+(f.name.split('.').pop().toLowerCase().replace(/\W/g,'')||'png');await gh(n,'PUT',{message:'Upload image',content:r.result.split(',')[1]});done(n);toast('Image uploaded')}catch(e){toast(e.message,1)}};r.readAsDataURL(f)};i.click()}
function field(p,k,label){const v=p[k],d=h('div','f'),L=h('label');L.textContent=label||LB[k]||k.replace(/_/g,' ');
 if(typeof v=='boolean'){d.className='f sw';const i=h('input');i.type='checkbox';i.checked=v;i.onchange=()=>p[k]=i.checked;L.onclick=()=>i.click();d.append(i,L);return d}
 d.append(L);
 if(Array.isArray(v)){
  if(v.every(x=>typeof x=='string')){const t=h('textarea');t.value=v.join('\n');t.rows=Math.min(9,v.length+2);t.oninput=()=>p[k]=t.value.split('\n');d.append(t);if(!/line/.test(L.textContent))L.textContent+=' (one per line)';return d}
  v.forEach((it,i)=>{const b=h('div','box'),bar=h('div','bar','<b>#'+(i+1)+(it.name||it.t||it.title?' · '+(it.name||it.t||it.title):'')+'</b>');
   [['arrow-up',()=>{if(i)[v[i-1],v[i]]=[v[i],v[i-1]]}],['arrow-down',()=>{if(i<v.length-1)[v[i+1],v[i]]=[v[i],v[i+1]]}],['trash',()=>{if(confirm('Remove this item?'))v.splice(i,1)}]].forEach(([ic,fn])=>{const x=h('button','b s sm','<i class="fa-solid fa-'+ic+'"></i>');x.onclick=()=>{fn();redraw()};bar.append(x)});
   b.append(bar);fields(it,b,v);d.append(b)});
  const a=h('button','b s','<i class="fa-solid fa-plus"></i> Add item');a.onclick=()=>{v.push(v.length?blank(v[v.length-1]):{});redraw()};d.append(a);return d}
 if(v&&typeof v=='object'){const b=h('div','box');fields(v,b);d.append(b);return d}
 if(IM.test(k)){const r=h('div','im'),i=h('input'),im=h('img'),u=h('button','b s','<i class="fa-solid fa-upload"></i> Upload');i.value=v||'';im.src=src(v);im.onerror=()=>im.style.visibility='hidden';im.onload=()=>im.style.visibility='';
  i.oninput=()=>{p[k]=i.value;im.src=src(i.value)};u.onclick=()=>upload(url=>{p[k]=i.value=url;im.src=src(url)});r.append(im,i,u);d.append(r);return d}
 const long=String(v).length>70||k=='d'||k=='p',i=h(long?'textarea':'input');i.value=v??'';i.oninput=()=>p[k]=i.value;d.append(i);return d}
function fields(o,box){Object.keys(o).forEach(k=>box.append(field(o,k)))}
function dash(m,body){const x=$('#c');x.innerHTML='';const top=h('div','top','<h1 class="t">'+m[1]+'</h1>');const sv=h('button','b','<i class="fa-solid fa-floppy-disk"></i> Save changes');
 sv.onclick=async()=>{try{await saveAll();toast('Saved. Website updates in about 1 minute.')}catch(e){toast(e.message,1)}};top.append(sv);x.append(top);if(m[4])x.append(h('p','hint',m[4]));x.append(body)}
const sections={async media(){const x=$('#c');x.innerHTML='<div class="top"><h1 class="t">Media Library</h1></div>';const up=h('button','b','<i class="fa-solid fa-upload"></i> Upload image');up.onclick=()=>upload(()=>sections.media());x.firstChild.append(up);
 let l=[];try{l=(await gh('uploads')).filter(f=>f.type=='file'&&!f.name.startsWith('.'))}catch{}
 const g=h('div','gr');l.forEach(f=>{const b=h('div','box','<img src="'+src(f.path)+'" alt="" onerror="this.style.opacity=.2"><small style="word-break:break-all;display:block;margin:6px 0">'+f.path+'</small>');const c=h('button','b s sm','Copy path'),d=h('button','b d sm','<i class="fa-solid fa-trash"></i>');
  c.onclick=()=>{navigator.clipboard.writeText(f.path);toast('Path copied')};d.onclick=async()=>{if(confirm('Delete this image?')){try{await gh(f.path,'DELETE',{message:'Delete image',sha:f.sha});sections.media()}catch(e){toast(e.message,1)}}};b.append(c,' ',d);g.append(b)});
 x.append(g.children.length?g:h('p','hint','No uploads yet.'))}};
async function open(m){cur=m;document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.k==m[0]));$('aside').classList.remove('o');
 if(sections[m[0]])return sections[m[0]]();
 draw(m)}
function draw(m){redraw=()=>draw(m);const b=h('div');if(Array.isArray(C[m[0]])){const f=field(C,m[0],' ');f.firstChild.remove();b.append(f)}else fields(C[m[0]],b);dash(m,b)}
function shell(){const r=$('#r');r.innerHTML='<div class="app"><aside><h2><i class="fa-solid fa-gauge-high"></i> World Tech Codex</h2></aside><main><button class="b s mb" id="mn"><i class="fa-solid fa-bars"></i> Menu</button><div id="c"></div></main></div>';
 const a=$('aside'),ok=t=>!t[3]||(t[3]=='owner'?me.role=='owner':me.perms.includes(t[3]));
 TABS.filter(ok).forEach(t=>{const l=h('a','','<i class="fa-solid fa-'+t[2]+'"></i> '+t[1]);l.dataset.k=t[0];l.onclick=()=>open(t);a.append(l)});
 a.append(h('div','sp'));const v=h('a','','<i class="fa-solid fa-arrow-up-right-from-square"></i> View website'),o=h('a','','<i class="fa-solid fa-right-from-bracket"></i> Log out ('+me.username+')');v.onclick=()=>window.open(site()+'/','_blank');o.onclick=async()=>{delete LS.wtc;location.reload()};a.append(v,o);
 $('#mn').onclick=()=>a.classList.toggle('o');open(TABS.filter(ok)[0])}
async function boot(){if(!LS.wtc)return login();try{me={role:'owner',perms:['pages','pricing','hiring','settings','media'],username:G().repo};C=await load();shell()}catch(e){const g=G();delete LS.wtc;login(e.message,g)}}
function login(err,g={}){$('#r').innerHTML='<div class="lg"><div class="lb"><h1><i class="fa-solid fa-lock"></i> CMS Login</h1><p>World Tech Codex'+(err?' <br><b style="color:var(--er)">'+err+'</b>':'')+'</p><div class="f"><label>Website repo (owner/repo)</label><input id="rp" placeholder="saad/portfolio"></div><div class="f"><label>Branch</label><input id="br" value="main"></div><div class="f"><label>GitHub token</label><input id="tk" type="text" autocomplete="off"></div><button class="b" id="go" style="width:100%;justify-content:center">Log in</button></div></div>';
 $('#rp').value=g.repo||'';$('#br').value=g.branch||'main';
 const go=async()=>{LS.wtc=JSON.stringify({repo:$('#rp').value.trim(),branch:$('#br').value.trim()||'main',token:$('#tk').value.trim()});boot()};$('#go').onclick=go;$('#tk').onkeydown=e=>{if(e.key=='Enter')go()}}
boot();
</script></body></html>
